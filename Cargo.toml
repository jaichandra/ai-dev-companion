[workspace]
resolver = "3"
members = ["crates/ai-dev-companion"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
url = "2"
unicode-normalization = "0.1"
sha2 = "0.10"
async-trait = "0.1"
libc = "0.2"
percent-encoding = "2"
base64 = "0.22"
getrandom = "0.3"
subtle = "2"
aes-gcm = "0.10"
tokio-util = "0.7"
regex = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "net", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
